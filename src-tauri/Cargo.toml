[package]
name = "siri-desktop"
version = "0.1.0"
description = "Desktop voice assistant with wake word, floating ball UI"
authors = ["VentCat"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "siri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
anyhow = "1"

# --- voice pipeline ---
# offline wake word (KWS), ASR (SenseVoice) and VAD. Use the prebuilt *shared*
# libraries (DLLs): the static MT libs reference newer MSVC STL vectorized
# symbols that the installed toolchain may lack, breaking the link. The build
# script auto-copies sherpa-onnx-c-api.dll + onnxruntime.dll next to the exe.
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
# microphone capture
cpal = "0.15"
# lock-free audio sample handoff from the cpal callback to the worker thread
crossbeam-channel = "0.5"
# parse config.toml
toml = "0.8"
# load the api key from .env
dotenvy = "0.15"
# intent rule matching
regex = "1"
once_cell = "1"
# screen brightness (async API) + a tiny executor to block on it
brightness = "0.5"
futures = "0.3"
# blocking HTTP for NetEase song search and the LLM fallback
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
# open URLs via the OS default handler (ShellExecute on Windows)
open = "5"
# audio playback for offline TTS (uses cpal 0.15, same as capture)
rodio = "0.17"
# single running instance + launch at login
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# global hotkey to summon the debug text-input (type a command instead of speaking)
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# system volume (Core Audio), media keys
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Input_KeyboardAndMouse",
] }
